<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css">
  <title>Allaiso · Nueva contraseña</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">ALLAISO</p>
      <h1>Nueva contraseña</h1>
      <form id="resetForm" class="auth-form">
        <label>Nueva contraseña
          <input id="newPassword" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <button id="resetBtn" class="primary auth-primary" type="submit">Guardar contraseña</button>
      </form>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./reset-password.js"></script>
</body>
</html>
