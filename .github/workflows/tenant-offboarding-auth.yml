name: Tenant Offboarding Auth Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/disable-tenant-auth/**'
      - '.github/workflows/tenant-offboarding-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-tenant-offboarding-auth
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tenant offboarding Auth function
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy authenticated-by-handler function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          supabase functions deploy disable-tenant-auth
          --project-ref qsxtmmkftsohkqqmytbb
          --no-verify-jwt
