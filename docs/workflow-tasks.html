<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tareas de Flujos de Trabajo de GestionPisos">
  <link rel="stylesheet" href="./app.css?v=2026091703">
  <link rel="stylesheet" href="./workflow-tasks.css?v=2026091804">
  <title>Allaiso · Tareas</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">ALLAISO</p><h1>Tareas</h1></div>
      <div class="global-actions">
        <button class="global-icon" data-theme-toggle aria-label="Cambiar tema"><span data-theme-icon>☾</span></button>
        <a class="global-icon" href="./workflows.html" aria-label="Volver a Flujos de Trabajo" title="Flujos de Trabajo">←</a>
        <a class="global-icon" href="./" aria-label="Inicio" title="Inicio">⌂</a>
      </div>
    </header>

    <section class="hero">
      <span class="badge">Trabajo asignado</span>
      <h2>Tareas visibles en tu ámbito.</h2>
      <p>Las ejecuciones de workflow se materializan aquí sin inventar un inquilino. Las acciones habilitadas cambian tarea y ejecución juntas para evitar estados divergentes.</p>
    </section>

    <section class="task-toolbar" aria-label="Filtros de tareas">
      <label>Mostrar
        <select id="taskFilter">
          <option value="open">Abiertas</option>
          <option value="all">Todas</option>
          <option value="mine">Asignadas a mí</option>
        </select>
      </label>
    </section>

    <section id="workflowTasks" class="task-list" aria-live="polite">
      <article class="task-card task-card--loading">Cargando tareas…</article>
    </section>

    <section id="tasksStatus" class="status">
      <span class="dot"></span>
      <span>Consultando tareas autorizadas.</span>
    </section>
  </main>

  <script src="./app.js?v=202609152" defer></script>
  <script type="module" src="./workflow-tasks.js?v=2026091805"></script>
  <script type="module" src="./auth-guard.js"></script>
</body>
</html>
