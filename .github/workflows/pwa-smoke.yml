name: PWA Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: PWA Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PWA smoke checks
        run: bash tests/pwa-smoke.sh
      - name: Run workflow hub smoke
        run: bash tests/workflows-smoke.sh
      - name: Run visual system smoke
        run: bash tests/visual-system-smoke.sh
      - name: Run login auth smoke
        run: bash tests/login-auth-smoke.sh
      - name: Run auth recovery smoke
        run: bash tests/auth-recovery-smoke.sh
      - name: Run MFA smoke
        run: bash tests/mfa-smoke.sh
      - name: Run platform operator recovery smoke
        run: bash tests/platform-operator-recovery-smoke.sh
      - name: Run factory reset helper smoke
        run: bash tests/factory-reset-smoke.sh
      - name: Run configuration and resources smoke
        run: bash tests/configuration-resources-smoke.sh
      - name: Run staff onboarding smoke
        run: bash tests/staff-onboarding-smoke.sh
      - name: Verify staff onboarding auth claim ordering
        run: bash tests/staff-onboarding-auth-claims-smoke.sh
      - name: Run external owner/tenant onboarding smoke
        run: bash tests/external-onboarding-smoke.sh
      - name: Run permissions administrative control smoke
        run: bash tests/permissions-admin-control-smoke.sh
      - name: Run permissions responsibility flow smoke
        run: bash tests/permissions-responsibility-flow-smoke.sh