<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tareas de Flujos de Trabajo de GestionPisos">
  <link rel="stylesheet" href="./app.css?v=2026091906">
  <link rel="stylesheet" href="./workflow-tasks.css?v=2026091910">
  <title>Allaiso · Tareas</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">ALLAISO</p><h1>Tareas</h1></div>
      <div class="global-actions"><a class="global-icon desktop-home-link" href="./" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6H10v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></a></div></header>
    <p class="page-subtitle">Las acciones cambian tarea y ejecución juntas.</p>
<section class="task-toolbar" aria-label="Filtros de tareas">
      <label>Mostrar
        <select id="taskFilter">
          <option value="open">Abiertas</option>
          <option value="all">Todas</option>
          <option value="mine">Asignadas a mí</option>
        </select>
      </label>
    </section>

    <section id="workflowTasks" class="task-list" aria-live="polite">
      <article class="task-card task-card--loading">Cargando tareas…</article>
    </section>

    <section id="tasksStatus" class="status">
      <span class="dot"></span>
      <span>Consultando tareas autorizadas.</span>
    </section>
  </main>

  <script src="./app.js?v=2026091902" defer></script>
  <script type="module" src="./workflow-tasks.js?v=2026091910"></script>
  <script type="module" src="./auth-guard.js"></script>
</body>
</html>
