<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./photo-pattern-editor.css?v=2026091406">
  <title>Allaiso · Editor de silueta</title>
</head>
<body>
  <main class="shell editor-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ALLAISO</p>
        <h1>Editor de silueta</h1>
      </div>
      <a class="ghost" href="./photo-patterns.html">Volver</a>
    </header>

    <section class="editor-hero">
      <span class="badge">Patrón manual</span>
      <h2 id="editorTitle">Cargando patrón…</h2>
      <p>Muévete por la foto con la mano. Activa Dibujar solo cuando quieras crear un trazo.</p>
    </section>

    <nav class="draw-toolbar" aria-label="Herramientas de dibujo">
      <button id="moveTool" type="button" class="tool-btn is-active" aria-pressed="true">
        <span aria-hidden="true">✋</span><small>Mover</small>
      </button>
      <button id="selectTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">☝️</span><small>Seleccionar</small>
      </button>
      <button id="drawTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">✏️</span><small>Lápiz</small>
      </button>
      <button id="lineTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">─</span><small>Recta</small>
      </button>
      <button id="rectTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">□</span><small>Rectángulo</small>
      </button>
      <button id="ellipseTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">○</span><small>Elipse</small>
      </button>
      <button id="eraseTool" type="button" class="tool-btn" aria-pressed="false">
        <span aria-hidden="true">⌫</span><small>Borrar</small>
      </button>
      <button id="undoBtn" type="button" class="tool-btn" disabled>
        <span aria-hidden="true">↶</span><small>Deshacer</small>
      </button>
      <button id="redoBtn" type="button" class="tool-btn" disabled>
        <span aria-hidden="true">↷</span><small>Rehacer</small>
      </button>
      <button id="zoomOutBtn" type="button" class="tool-btn">
        <span aria-hidden="true">−</span><small>Zoom</small>
      </button>
      <button id="zoomInBtn" type="button" class="tool-btn">
        <span aria-hidden="true">＋</span><small>Zoom</small>
      </button>
    </nav>

    <section class="draw-context">
      <p id="toolHint" class="draw-context__hint">Modo Mover · desplaza la foto sin dibujar.</p>
      <label id="labelWrap" class="draw-context__label" hidden>
        Etiqueta
        <input id="strokeLabel" type="text" maxlength="80" placeholder="Ej. Ventilador">
      </label>
    </section>

    <section id="editorStage" class="editor-stage" hidden>
      <div id="editorViewport" class="editor-viewport">
        <div id="imageWrap" class="editor-image-wrap">
          <img id="referenceImage" alt="Fotografía patrón">
          <canvas id="drawingCanvas" aria-label="Área de dibujo manual"></canvas>
        </div>
      </div>
    </section>

    <details class="editor-strokes">
      <summary>
        <span>Trazos</span>
        <span id="strokeCount" class="badge">0</span>
      </summary>
      <div id="strokeList" class="editor-stroke-list"></div>
      <button id="clearBtn" type="button" class="ghost danger-action">Borrar todos los trazos</button>
    </details>

    <div class="editor-savebar">
      <button id="saveBtn" type="button" class="primary" disabled>Guardar silueta</button>
    </div>

    <p id="editorMessage" class="camera-message" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="./photo-pattern-editor.js?v=2026091406"></script>
  <script type="module" src="./auth-guard.js"></script>
</body>
</html>
