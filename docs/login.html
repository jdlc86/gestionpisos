<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css">
  <title>Allaiso · Acceso</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">ALLAISO</p>
      <h1>Acceso a GestionPisos</h1>
      <p class="auth-lead">Inicia sesión con tu cuenta autorizada.</p>

      <form id="loginForm" class="auth-form" method="post">
        <label>Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Contraseña
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="primary auth-primary" type="submit">Entrar</button>
      </form>

      <button id="forgotBtn" class="auth-link" type="button">He olvidado mi contraseña</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    (() => {
      const form = document.getElementById("loginForm");
      const message = document.getElementById("authMessage");
      const recoveryKey = "allaiso-login-module-recovery-v2";

      // Fail closed: credentials must never be submitted by the browser itself.
      form?.addEventListener("submit", event => event.preventDefault());

      window.__loginModuleReady = false;
      window.__loginModuleFailureHandled = false;
      window.__handleLoginModuleFailure = async error => {
        if (window.__loginModuleReady || window.__loginModuleFailureHandled) return;
        window.__loginModuleFailureHandled = true;
        console.error("login_module_load_failed", error);

        const alreadyRecovered = sessionStorage.getItem(recoveryKey) === "1";
        if (!alreadyRecovered) {
          sessionStorage.setItem(recoveryKey, "1");
          if (message) message.textContent = "Actualizando el acceso…";

          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations
                .filter(registration => new URL(registration.scope).pathname.includes("/gestionpisos/"))
                .map(registration => registration.unregister()));
            }
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys
                .filter(key => key.startsWith("gestionpisos-shell-"))
                .map(key => caches.delete(key)));
            }
          } catch (cleanupError) {
            console.error("login_cache_recovery_failed", cleanupError);
          }

          const refreshed = new URL(window.location.href);
          refreshed.searchParams.set("auth_refresh", "2026091604");
          window.location.replace(refreshed.href);
          return;
        }

        if (message) {
          message.textContent = "No se pudo cargar el módulo de acceso. Comprueba la conexión y vuelve a abrir GestionPisos.";
          message.classList.add("is-error");
        }
      };

      setTimeout(() => {
        if (!window.__loginModuleReady) window.__handleLoginModuleFailure?.(new Error("login_module_timeout"));
      }, 4000);
    })();
  </script>
  <script type="module">
    import("./login.js?v=2026091604").catch(error => window.__handleLoginModuleFailure?.(error));
  </script>
</body>
</html>
