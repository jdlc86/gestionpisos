<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css">
  <title>Allaiso · Acceso</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">ALLAISO</p>
      <h1>Acceso a GestionPisos</h1>
      <p class="auth-lead">Inicia sesión con tu cuenta autorizada.</p>

      <form id="loginForm" class="auth-form" method="post">
        <label>Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Contraseña
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="primary auth-primary" type="submit">Entrar</button>
      </form>

      <button id="forgotBtn" class="auth-link" type="button">He olvidado mi contraseña</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    // Fail closed if the ES module cannot load: never let the browser submit
    // credentials as a native form request or place them in the URL.
    document.getElementById("loginForm")?.addEventListener("submit", event => event.preventDefault());
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  </script>
  <script type="module" src="./login.js?v=2026091602"></script>
</body>
</html>
