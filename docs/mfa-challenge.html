<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css?v=2026091702">
  <title>Allaiso · Verificación MFA</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">ALLAISO</p>
      <h1>Segundo factor</h1>
      <p class="auth-lead">Abre tu app autenticadora e introduce el código de 6 dígitos.</p>

      <form id="mfaChallengeForm" class="auth-form">
        <label>Código de verificación
          <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required disabled>
        </label>
        <button id="mfaChallengeBtn" class="primary auth-primary" type="submit" disabled>Verificar</button>
      </form>

      <button id="cancelMfaBtn" class="auth-link" type="button">Cancelar y cerrar sesión</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite">Comprobando tu segundo factor…</p>
    </section>
  </main>
  <script type="module" src="./mfa-challenge.js?v=2026091701"></script>
</body>
</html>
