name: Notification Email Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-notification-email
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notification-email Edge Function
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy DB-authenticated notification email function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          supabase functions deploy notification-email
          --project-ref qsxtmmkftsohkqqmytbb
          --no-verify-jwt
