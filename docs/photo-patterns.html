<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="./app.css?v=2026091904">
  <link rel="stylesheet" href="./photo-patterns.css?v=2026091901">
  <title>Allaiso · Patrones de foto</title>
</head>
<body>
  <main class="shell pattern-shell">
    <header class="topbar"><div class="context-heading"><a id="patternsBackLink" class="context-back" href="./portfolio.html" aria-label="Volver" title="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><p class="eyebrow">ALLAISO</p><h1>Patrones de foto</h1></div></div></header>

    <section class="hero">
      <span class="badge">Fotoverificación</span>
      <h2>Registrar referencia</h2>
      <p>Selecciona el piso y la zona. Después de capturar la foto de referencia podrás dibujar manualmente las siluetas o bordes que quieras usar como guía.</p>
    </section>

    <form id="patternForm" class="pattern-form">
      <label>Piso
        <select id="propertySelect" required></select>
      </label>
      <label>Zona / etiqueta
        <input id="zoneLabel" type="text" maxlength="120" required placeholder="Ej. Baño, Cocina, Salón, Terraza">
      </label>
      <button id="captureReference" class="primary" type="submit">Capturar referencia</button>
    </form>

    <section class="pattern-current">
      <h3>Patrones activos</h3>
      <div id="patternList" class="pattern-list"></div>
    </section>

    <p id="patternMessage" class="camera-message" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="./photo-patterns.js?v=2026091502"></script>
  <script type="module" src="./auth-guard.js"></script>
  <script src="./app.js?v=202609152" defer></script>
</body>
</html>
