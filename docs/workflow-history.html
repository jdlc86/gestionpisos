<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Historial transversal de Flujos de Trabajo de GestionPisos">
  <link rel="stylesheet" href="./app.css?v=2026091906">
  <link rel="stylesheet" href="./workflow-history.css?v=2026091910">
  <title>Allaiso · Historial</title>
</head>
<body>
  <main class="shell">
    <header id="historyTopbar" class="topbar history-topbar">
      <div id="historyNormalHeader" class="history-header-mode history-header-normal">
        <div class="context-heading">
          <a class="context-back" href="./workflows.html" aria-label="Volver a Flujos" title="Volver a Flujos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
          <div><p class="eyebrow">ALLAISO</p><h1>Historial</h1></div>
        </div>
        <div class="history-header-actions">
          <button id="historySearchToggle" type="button" class="history-icon-button" aria-label="Buscar en historial" title="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          </button>
          <a class="global-icon desktop-home-link" href="./" aria-label="Inicio" title="Inicio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6H10v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
          </a>
        </div>
      </div>

      <div id="historySearchHeader" class="history-header-mode history-search-mode" hidden>
        <button id="historySearchClose" type="button" class="history-icon-button" aria-label="Cerrar búsqueda" title="Cerrar búsqueda">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <label class="history-search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="historySearch" type="search" autocomplete="off" aria-label="Buscar ejecuciones" placeholder="Buscar flujo, piso o persona…">
        </label>
        <button id="historySearchClear" type="button" class="history-icon-button" aria-label="Limpiar y cerrar búsqueda" title="Limpiar y cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
    </header>

    <p class="page-subtitle">Cada ejecución conserva su tarea, evidencias, decisiones y cierre.</p>

    <nav class="history-filters" aria-label="Filtrar historial">
      <button type="button" class="history-filter is-active" data-history-filter="all" aria-pressed="true">Todas</button>
      <button type="button" class="history-filter" data-history-filter="open" aria-pressed="false">En curso</button>
      <button type="button" class="history-filter" data-history-filter="completed" aria-pressed="false">Completadas</button>
      <button type="button" class="history-filter" data-history-filter="rejected" aria-pressed="false">Rechazadas</button>
    </nav>

    <button id="historyActiveSearch" type="button" class="history-search-chip" hidden aria-label="Quitar búsqueda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <span id="historyActiveSearchText"></span>
      <span aria-hidden="true">×</span>
    </button>

    <section id="workflowHistory" class="history-list" aria-live="polite">
      <article class="history-card history-card--loading">Cargando historial…</article>
    </section>

    <section id="historyStatus" class="status">
      <span class="dot"></span>
      <span>Reconstruyendo ejecuciones autorizadas.</span>
    </section>
  </main>

  <script src="./app.js?v=2026091902" defer></script>
  <script type="module" src="./workflow-history.js?v=2026091911"></script>
  <script type="module" src="./auth-guard.js"></script>
</body>
</html>
