name: Schema Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  active-schema:
    name: Schema Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy Supabase table usage
        run: bash tests/no-legacy-schema.sh

      - name: Verify Supabase migration history shape
        run: bash tests/migration-history-smoke.sh

      - name: Verify security regression artifacts
        run: bash tests/schema-regression-smoke.sh

      - name: Verify property staff access v3 contract
        run: bash tests/property-staff-access-v3-contract.sh

      - name: Verify administrative write control contract
        run: bash tests/admin-write-control-schema-smoke.sh

      - name: Verify internal staff deactivation contract
        run: bash tests/internal-staff-deactivation-schema-smoke.sh

      - name: Verify responsibility resolution contract
        run: bash tests/responsibility-resolution-schema-smoke.sh

      - name: Verify internal staff onboarding contract
        run: bash tests/internal-staff-onboarding-schema-smoke.sh

      - name: Verify external owner/tenant onboarding contract
        run: bash tests/external-onboarding-schema-smoke.sh

      - name: Verify tenant offboarding access contract
        run: bash tests/tenant-offboarding-access-schema-smoke.sh

      - name: Verify workflow definition persistence contract
        run: bash tests/workflow-definition-schema-smoke.sh

      - name: Run isolated PostgreSQL security regression
        run: bash tests/database-regression-v2.sh
