<!doctype html>
<html lang="es" data-auth-pending="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="./app.css?v=2026091906">
  <title>Allaiso · Limpieza</title>
</head>
<body>
<main class="shell">
  <header class="topbar"><div><p class="eyebrow">ALLAISO</p><h1>Limpieza</h1></div><div class="global-actions"><a class="global-icon desktop-home-link" href="./" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6H10v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></a></div></header>
  <section class="hero">
    <span class="badge">Fotoverificación</span>
    <h2 id="cleaningTitle">Tu limpieza</h2>
    <p id="cleaningIntro">Consulta las zonas que debes fotografiar. Las zonas asignadas no cambian si sales y vuelves.</p>
  </section>

  <section id="taskLookup" class="card premium-nav-card">
    <strong class="module-heading"><span class="premium-icon" data-premium-icon="cleaning" aria-hidden="true"></span>Abrir tarea de limpieza</strong>
    <span>Introduce el identificador de la tarea asignada para esta primera prueba del flujo.</span>
    <form id="taskForm">
      <label for="taskId">ID de tarea</label>
      <input id="taskId" name="task_id" autocomplete="off" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      <button class="primary" type="submit">Abrir limpieza</button>
    </form>
  </section>

  <section id="cleaningTask" hidden>
    <div class="status"><span class="dot"></span><span id="taskMeta"></span></div>
    <section id="checklist" class="grid" aria-label="Fotos solicitadas"></section>
  </section>
  <p id="cleaningMessage" class="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="./cleaning.js?v=2026091501"></script>
<script type="module" src="./auth-guard.js"></script>
  <script src="./app.js?v=2026091902" defer></script>
</body></html>
